name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Build gem
        run: bundle exec rake build

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "anki_generator-${{ steps.get_version.outputs.VERSION }}.gem#anki_generator-${{ steps.get_version.outputs.VERSION }}.gem" \
            --title "Release ${{ steps.get_version.outputs.VERSION }}" \
            --notes "## Changes in ${{ steps.get_version.outputs.VERSION }}

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.

          ## Installation

          \`\`\`bash
          gem install anki_generator -v ${{ steps.get_version.outputs.VERSION }}
          \`\`\`"

    # Uncomment if you want to publish to RubyGems automatically
    # - name: Publish to RubyGems
    #   env:
    #     GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
    #   run: gem push anki_generator-${{ steps.get_version.outputs.VERSION }}.gem
